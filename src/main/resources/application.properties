spring.application.name=catalogo-service

# Seguridad: La URL oficial de Google que emitirá y validará nuestros tokens
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

# =================================================================
# CONFIGURACIÓN DE BASE DE DATOS (Con el nombre definitivo)
# =================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_my_dreams
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =================================================================
# CONFIGURACIÓN DE HIBERNATE (ORM)
# =================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true