spring.application.name=catalogo-service

# =================================================================
# CONFIGURACIÓN DE BASE DE DATOS CLOUD (AWS RDS)
# =================================================================
# Real credentials come from environment variables (RNF-11). Never commit secrets.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pasteleria_my_dreams?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =================================================================
# CONFIGURACIÓN DE HIBERNATE (ORM)
# =================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Imagenes de productos subidas desde el admin (ImageStorage): disco local en
# dev; el adaptador S3 reemplaza esto al migrar a AWS sin tocar el contrato
app.imagenes.directorio=./uploads
# El tope real (5 MB) lo aplica el controlador con mensaje amable; el del
# servlet queda mas arriba para que ese mensaje llegue antes que un 500
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# Stream de eventos de negocio (Entrega 3): LocalStack en local, Kinesis real
# en el lab (KINESIS_ENDPOINT vacío = AWS). Publica el evento producto_visto.
app.kinesis.habilitado=true
app.kinesis.endpoint=${KINESIS_ENDPOINT:http://localhost:4566}
app.kinesis.region=${KINESIS_REGION:us-east-1}
app.kinesis.stream=eventos-negocio
app.kinesis.auto-crear-stream=true

# Devtools: el RestartClassLoader no logra ver las clases del AWS SDK (JARs
# modulares) y el servicio no arranca. Se desactiva el reinicio automático:
# solo perdemos el hot-reload de Java, el resto de devtools sigue igual.
spring.devtools.restart.enabled=false